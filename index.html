    --dawn-soft:rgba(232,164,100,0.16);
    --sage-soft:rgba(184,147,90,0.14);
    --water-soft:rgba(212,138,92,0.13);
    --period-soft:rgba(217,122,90,0.14);
    --shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.5);
    --ink-rgb: 243,236,228;
    --water-rgb: 212,138,92;
    --water-card-1:#241F1B;
    --water-card-2:#1B1613;
    --cta:#E8A464;
    --cta-text:#171412;
    --water-cta:#E8A464;
    --water-cta-text:#171412;
    --cta-border: transparent;
    --on-accent:#171412;
  }

  html[data-theme="deepocean"]{
    --paper:#14152E;
    --panel:#1E2044;
    --ink:#E8F1F5;
    --ink-soft:#7DA3B8;
    --line:#2A2C4E;
    --dawn:#E8B85C;
    --dusk:#5CC4D9;
    --rose:#E86E8A;
    --sage:#4FBFA8;
    --water:#9DA6EA;
    --period:#8A7ED9;
    --rose-soft:rgba(232,110,138,0.15);
    --dusk-soft:rgba(92,196,217,0.13);
    --dawn-soft:rgba(232,184,92,0.16);
    --sage-soft:rgba(79,191,168,0.14);
    --water-soft:rgba(157,166,234,0.14);
    --period-soft:rgba(138,126,217,0.14);
    --shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.55);
    --ink-rgb: 232,241,245;
    --water-rgb: 157,166,234;
    --water-card-1:#1E2044;
    --water-card-2:#14152E;
    --cta:#9DA6EA;
    --cta-text:#14152E;
    --water-cta:#9DA6EA;
    --water-cta-text:#14152E;
    --cta-border: transparent;
    --on-accent:#14152E;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Poppins', 'Avenir Next', 'Avenir', -apple-system, 'Space Grotesk', system-ui, sans-serif;
    display:flex; justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--dusk); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  h1,h2,h3{margin:0; font-family:'Instrument Serif', Georgia, serif;}

  #app{
    width:100%; max-width:430px; min-height:100vh;
    background:var(--paper); position:relative;
    padding-bottom:96px; display:flex; flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  .topbar{display:flex; justify-content:space-between; align-items:center; padding:18px 20px 4px; position:relative; z-index:5;}
  .topbar .wordmark{font-family:'Instrument Serif', serif; font-style:italic; font-size:19px; transition:color 0.3s;}
  .topbar .wordmark b{font-style:normal; font-weight:400; color:var(--dusk); transition:color 0.3s;}
  .topbar-right{display:flex; align-items:center; gap:8px;}
  .gear-btn{background:var(--panel); border:1px solid var(--line); border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); padding:0; transition:background 0.3s, color 0.3s, border-color 0.3s;}
  .gear-btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7;}
  /* When Today's illustration extends up behind the topbar, it floats transparently on top of it. */
  .topbar.overlay{position:absolute; top:0; left:0; right:0; padding:16px 18px 0; z-index:15;}

  /* ---------- Views ---------- */
  .view{display:none; padding:6px 20px 20px; animation:fadein 0.25s ease;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Scene hero (Today) — full-bleed, no card chrome ---------- */
  .scene-card{ margin: -6px -20px 0; }
  .scene-wrap{position:relative; line-height:0; border-radius:0 0 50% 50% / 0 0 42px 42px; overflow:hidden;}
  .scene-wrap svg{width:100%; height:auto; display:block;}
  .scene-greet{position:absolute; top:58px; left:18px; right:18px; z-index:2; line-height:1.04;}
  .scene-greet .sg-hello{font-family:'Instrument Serif', serif; font-weight:600; font-size:38px; line-height:1.02; letter-spacing:-0.018em;}
  .scene-greet .sg-hello em{font-style:italic;}
  .scene-greet .sg-date{font-family:'Poppins', 'Avenir Next', 'Avenir', -apple-system, 'Space Grotesk', system-ui, sans-serif; font-size:11.5px; margin-top:5px; letter-spacing:0.03em; opacity:0.82;}
  .star{animation:twinkle 3.4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:var(--op);} 50%{opacity:calc(var(--op)*0.3);}}

  /* Daily line, sitting on the light hills at the base of the illustration */
  .sg-quote{
    font-family:'Instrument Serif', serif; font-style:italic;
    font-size:16px; line-height:1.36; margin-top:12px;
    max-width:78%; opacity:0.92;
  }

  /* Stats row, back below the banner on plain paper */
  .scene-stats{display:flex; align-items:center; padding:18px 10px 4px;}
  .scene-stat{flex:1; text-align:center;}
  .scene-stat .ss-val{font-family:'Instrument Serif', serif; font-size:27px; line-height:1; color:var(--ink);}
  .scene-stat .ss-lbl{font-size:9.5px; letter-spacing:0.04em; margin-top:5px; color:var(--ink-soft);}
  .scene-stat.mid{flex:0 0 auto; padding:0 6px;}

  /* ---------- Insight card (Calendar/Progress keep the card language) ---------- */
  .insight-card{margin-top:14px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px 17px; box-shadow:var(--shadow);}
  .insight-card.empty{border-style:dashed; box-shadow:none;}
  .insight-card .ic-title{font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--dusk); display:flex; align-items:center; gap:6px;}
  .insight-card .ic-title::before{content:'✦'; font-size:10px;}
  .insight-card .ic-body{font-size:13px; line-height:1.5; margin-top:7px;}
  .insight-card .ic-foot{font-size:10.5px; color:var(--ink-soft); margin-top:8px;}
  .insight-card .ic-foot button{background:none; border:none; color:var(--dusk); font-weight:700; text-decoration:underline; cursor:pointer; font-size:10.5px; padding:0;}
  .insight-card .ic-btn{margin-top:10px; background:var(--cta); color:var(--cta-text); border:1px solid var(--cta-border); border-radius:16px; padding:8px 15px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .insight-card .ic-btn[disabled]{opacity:0.5; cursor:default;}

  .tip{margin-top:14px; padding:0 2px; font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; gap:10px; align-items:center;}
  .tip button{background:none; border:none; color:var(--dusk); font-size:11.5px; font-weight:700; cursor:pointer;}

  /* ---------- Routine — flush rows on the ombre, no card chrome ---------- */
  .routine-card{margin-top:24px;}
  .routine-head{display:flex; justify-content:space-between; align-items:baseline; padding:0 2px 8px;}
  .routine-head h3{font-size:16px; font-weight:600; font-family:'Instrument Serif', serif; font-style:italic;}
  .routine-head .frac{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .step-row{display:flex; align-items:center; gap:12px; padding:12px 2px; border-top:1px solid rgba(var(--ink-rgb),0.08); cursor:pointer; user-select:none;}
  .step-row.disabled{cursor:default; opacity:0.55;}
  .step-row .toggle{width:26px; height:26px; border-radius:50%; border:1.6px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:background 0.15s, border-color 0.15s;}
  .step-row .toggle svg{width:13px; height:13px; opacity:0;}
  .step-row.done .toggle{background:var(--sage); border-color:var(--sage);}
  .step-row.done .toggle svg{opacity:1; stroke:#fff;}
  .step-row.skipped .toggle{background:var(--rose-soft); border-color:var(--rose);}
  .step-row.skipped .toggle svg{opacity:1; stroke:var(--rose);}
  .step-row .info{flex:1; min-width:0;}
  .step-row .name{font-size:13.5px; font-weight:600;}
  .step-row.done .name{color:var(--ink-soft);}
  .step-row.skipped .name{color:var(--ink-soft); text-decoration:line-through;}
  .step-row .role{font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .step-row .state-lbl{font-size:10.5px; color:var(--ink-soft); flex-shrink:0;}
  .step-row.done .state-lbl{color:var(--sage);}
  .step-row.skipped .state-lbl{color:var(--rose);}
  .wait-note{font-size:10px; color:var(--water); margin-top:3px; font-weight:600;}
  .badge-critical{font-size:9px; font-weight:700; color:var(--rose); background:var(--rose-soft); padding:2px 6px; border-radius:8px; margin-left:6px;}
  .note-wrap{padding:16px 2px 4px;}
  .note-wrap label{font-size:11px; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .note-wrap textarea{width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:12.5px; resize:none; height:52px; background:var(--panel); color:var(--ink);}
  .note-wrap textarea::placeholder{color:var(--ink-soft); opacity:0.85;}

  /* Quick water-log content reused inside a modal */
  .water-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center;}
  .water-btn{background:var(--water-soft); color:var(--water); border:none; border-radius:20px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer;}
  .water-edit-link{background:none; border:none; color:var(--ink-soft); font-size:11px; text-decoration:underline; cursor:pointer; padding:6px 4px;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--panel); border-top:1px solid var(--line); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:50;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; padding:6px 2px; color:var(--ink-soft); border-radius:12px;}
  .nav-btn svg{width:21px; height:21px; stroke:currentColor; fill:none;}
  .nav-btn span{font-size:9.5px; font-weight:600;}
  .nav-btn.active{color:var(--dusk);}

  .storage-warn{
    background:var(--rose-soft); border:1px solid var(--rose); border-radius:14px;
    padding:12px 14px; margin:10px 0 4px; font-size:11.5px; line-height:1.5; color:var(--rose);
  }
  .storage-warn strong{display:block; margin-bottom:3px; font-size:12.5px;}
  .sec-title{font-family:'Instrument Serif', serif; font-size:24px; margin-top:8px;}
  .sec-title-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .sec-title-row .sec-title{margin-top:8px;}
  .photo-vis-toggle{display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:7px 12px; font-size:11px; font-weight:700; color:var(--ink-soft); cursor:pointer; flex-shrink:0;}
  .sec-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  /* ---------- Calendar ---------- */
  .cal-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px;}
  .cal-nav button{background:var(--panel); border:1px solid var(--line); border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);}
  .cal-nav .cal-month{font-family:'Instrument Serif', serif; font-size:19px;}
  .cal-grid{margin-top:14px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow);}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:8px;}
  .cal-weekdays span{font-size:10px; color:var(--ink-soft); font-weight:600;}
  .cal-days{display:grid; grid-template-columns:repeat(7,1fr); row-gap:6px;}
  .cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; cursor:pointer; gap:3px;}
  .cal-cell.empty{cursor:default;}
  .cal-cell .num{font-size:12px; font-weight:500;}
  .cal-cell.period-day{background:var(--period-soft);}
  .cal-cell.today{background:var(--dusk-soft);}
  .cal-cell.today.period-day{background:linear-gradient(135deg, var(--period-soft), var(--dusk-soft));}
  .cal-cell.today .num{font-weight:700; color:var(--dusk);}
  .cal-dots-row{display:flex; gap:2.5px; justify-content:center; min-height:5px;}
  .cal-dots-row .cd{width:4.5px; height:4.5px; border-radius:50%;}
  .cal-legend{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap;}
  .cal-legend .li{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-soft);}
  .cal-legend .sw{width:9px; height:9px; border-radius:50%;}
  .cal-add-row{display:flex; justify-content:flex-end; margin-top:12px;}
  .cal-add-btn{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:7px 14px; font-size:11.5px; font-weight:700; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:6px;}

  /* ---------- Progress ---------- */
  .circle-card{margin-top:14px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow);}
  .circle-card h3{font-size:14px; font-weight:600;}
  .cc-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .range-toggle{display:flex; gap:3px; background:var(--paper); border-radius:10px; padding:3px;}
  .rt-btn{background:none; border:none; padding:5px 10px; font-size:10.5px; font-weight:700; color:var(--ink-soft); border-radius:8px; cursor:pointer;}
  .rt-btn.active{background:var(--panel); color:var(--ink); box-shadow:var(--shadow);}
  .dn-scroll-outer{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:14px; scrollbar-width:none;}
  .dn-scroll-outer::-webkit-scrollbar{display:none;}
  .dn-stack{display:flex; flex-direction:column; gap:7px; width:max-content; min-width:100%;}
  .dn-track-row{display:flex; align-items:center; gap:3px;}
  .dn-sticky-label{position:sticky; left:0; z-index:2; background:var(--panel); padding-right:8px; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); flex-shrink:0; width:38px;}
  .dn-cell{flex:0 0 auto; width:20px; display:flex; align-items:center; justify-content:center;}
  .dn-cell.dn-label{font-size:8.5px; color:var(--ink-soft); font-weight:600;}
  .dn-legend{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--line);}
  .dn-legend .li{display:flex; align-items:center; gap:6px; font-size:10px; color:var(--ink-soft);}
  .prod-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  .prod-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow);}
  .prod-card .p-name{font-size:12px; font-weight:700;}
  .prod-card .p-num{font-family:'Instrument Serif', serif; font-size:26px; margin-top:6px; color:var(--dusk);}
  .prod-card .p-lbl{font-size:10px; color:var(--ink-soft);}

  /* ---------- Hair care (boxed card, unlike the seamless Today page) ---------- */
  .hair-card{margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow);}
  .hair-card .routine-head{padding:15px 18px 10px;}
  .hair-card .routine-head h3{font-style:normal;}
  .hair-card .step-row{padding:12px 18px; border-top:1px solid var(--line);}

  /* ---------- Product manager (Settings) ---------- */
  .mp-section{margin-top:18px;}
  .mp-section-title{font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;}
  .mp-row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:7px;}
  .mp-row.dragging{box-shadow:0 6px 18px rgba(0,0,0,0.18); border-color:var(--dusk); z-index:20; position:relative;}
  .mp-drag{flex-shrink:0; color:var(--ink-soft); cursor:grab; padding:4px; touch-action:none;}
  .mp-row.dragging .mp-drag{cursor:grabbing;}
  .mp-row-text{flex:1; min-width:0;}
  .mp-name{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis;}
  .mp-role{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .mp-freq{font-size:10px; color:var(--dusk); margin-top:2px; font-weight:700;}
  .mp-wait{font-size:10px; color:var(--water); margin-top:2px; font-weight:600;}

  .freq-toggle{display:flex; gap:6px;}
  .freq-btn{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px; font-size:11.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .freq-btn.active{background:var(--dusk); color:var(--on-accent); border-color:var(--dusk);}
  .freq-days{display:flex; gap:5px; margin-top:8px;}
  .freq-day{flex:1; aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); background:var(--panel); color:var(--ink-soft); font-size:11px; font-weight:700; cursor:pointer; padding:0;}
  .freq-day.active{background:var(--dusk); color:var(--on-accent); border-color:var(--dusk);}
  .mp-edit{background:var(--paper); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 11px; font-size:11px; font-weight:700; cursor:pointer; flex-shrink:0;}

  /* ---------- Prominent water tracker (Today) ---------- */
  .water-hero{
    margin-top:16px; border-radius:22px; padding:20px 20px 18px;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(var(--water-rgb),0.10), transparent 60%),
      linear-gradient(165deg, var(--water-card-1) 0%, var(--water-card-2) 100%);
    border:1px solid rgba(var(--water-rgb),0.16);
    box-shadow:0 1px 2px rgba(var(--ink-rgb),0.03), 0 8px 24px rgba(var(--water-rgb),0.08);
  }
  .water-hero.overdue{
    border-color:rgba(var(--water-rgb),0.42);
    box-shadow:0 0 0 3px rgba(var(--water-rgb),0.09), 0 8px 24px rgba(var(--water-rgb),0.14);
  }
  .wh-top{display:flex; align-items:center; gap:17px;}
  .wh-glass{flex-shrink:0; cursor:pointer;}
  .wh-info{flex:1; min-width:0;}
  .wh-title{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .wh-title h3{font-family:'Instrument Serif', serif; font-style:italic; font-size:21px; color:var(--ink);}
  .wh-amount{font-size:11.5px; color:var(--water); font-weight:700; letter-spacing:0.01em; flex-shrink:0;}
  .wh-sub{font-size:12px; color:var(--ink-soft); margin-top:5px; line-height:1.45;}
  .wh-sub strong{color:var(--water); font-weight:700;}

  .wh-cta-row{display:flex; gap:8px; margin-top:18px;}
  .wh-cta{
    flex:1; background:var(--water-cta); color:var(--water-cta-text); border:1px solid var(--cta-border); border-radius:15px;
    padding:14px 10px; font-size:13.5px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
    box-shadow:0 3px 10px rgba(var(--ink-rgb),0.22);
  }
  .wh-cta.secondary{
    flex:0 0 auto; background:rgba(var(--water-rgb),0.10); color:var(--water);
    padding:14px 18px; box-shadow:none;
  }
  .wh-cta svg{width:15px; height:15px;}
  .wh-edit{
    background:none; border:none; color:var(--ink-soft); font-size:10.5px;
    cursor:pointer; padding:12px 2px 0; display:block; width:100%; text-align:center;
    letter-spacing:0.03em;
  }

  /* ---------- Photos ---------- */
  .add-photo-btn{margin-top:16px; width:100%; padding:13px; border-radius:14px; border:1px solid var(--cta-border); background:var(--cta); color:var(--cta-text); font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}

  .compare-gate{margin-top:16px; background:var(--panel); border:1px dashed var(--line); border-radius:16px; padding:16px 17px;}
  .compare-section{margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 17px; box-shadow:var(--shadow);}
  .cg-title{font-family:'Instrument Serif', serif; font-style:italic; font-size:17px; color:var(--ink);}
  .cg-body{font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
  .angle-chip-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .angle-chip{background:var(--paper); border:1.3px solid var(--line); border-radius:14px; padding:6px 13px; font-size:11px; font-weight:700; color:var(--ink-soft); cursor:pointer; text-transform:capitalize;}
  .angle-chip.active{background:var(--dusk); color:var(--on-accent); border-color:var(--dusk);}
  .compare-section .sec-sub{margin-top:10px;}

  .ba-wrap{position:relative; width:100%; aspect-ratio:3/4; border-radius:16px; overflow:hidden; background:var(--line); box-shadow:var(--shadow); margin-top:10px;}

<script>
/* =========================================================
   STORAGE SHIM
   Inside Claude, window.storage already exists and is used as-is.
   Standalone (saved file / hosted URL), we provide the same async
   API backed by IndexedDB so photos and logs persist properly.
   IndexedDB is used rather than localStorage because photos are
   base64 and would blow past the ~5 MB localStorage ceiling fast.
   ========================================================= */
(function(){
  if (window.storage && typeof window.storage.get === 'function') { window.__storageMode='claude'; return; }
  var DB='dawn-to-dusk', STORE='kv', dbp=null;
  function open_(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(STORE); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn){
    return open_().then(function(db){
      return new Promise(function(res, rej){
        var t = db.transaction(STORE, mode), s = t.objectStore(STORE), out;
        out = fn(s);
        t.oncomplete = function(){ res(out && out.result !== undefined ? out.result : undefined); };
        t.onerror = function(){ rej(t.error); };
      });
    });
  }
  window.storage = {
    get: function(key){
      return tx('readonly', function(s){ return s.get(key); }).then(function(v){
        return (v === undefined || v === null) ? null : {key:key, value:v, shared:false};
      });
    },
    set: function(key, value){
      return tx('readwrite', function(s){ s.put(value, key); }).then(function(){
        return {key:key, value:value, shared:false};
      });
    },
    delete: function(key){
      return tx('readwrite', function(s){ s.delete(key); }).then(function(){
        return {key:key, deleted:true, shared:false};
      });
    },
    list: function(prefix){
      return tx('readonly', function(s){ return s.getAllKeys(); }).then(function(keys){
        keys = keys || [];
        if(prefix) keys = keys.filter(function(k){ return String(k).indexOf(prefix)===0; });
        return {keys:keys, prefix:prefix, shared:false};
      });
    }
  };
  window.__storageMode='local';
})();

function toISO(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');

}
function fromISO(iso){ var p=iso.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(iso,n){ var d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function diffDays(a,b){ return Math.round((fromISO(b)-fromISO(a))/86400000); }

function fmtLong(iso){
  var d=fromISO(iso);

function fmtShort(iso){ var d=fromISO(iso); return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()+', '+d.getFullYear(); }
function fmtShortNoYear(iso){ var d=fromISO(iso); return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate(); }
function relativeDay(iso){
  var diff = diffDays(todayISO(), iso);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  if(diff>0) return 'in '+diff+' days';
  return (-diff)+' days ago';

async function safeGet(key, fallback){

  // Migrate the old per-section {am:[],pm:[],hair:[]} custom-products shape, and fold
  // the old vitaminCUnlocked flag into a real order-array entry, so existing users'
  // customizations and unlocked Vitamin C carry forward with nothing lost.
  if(STATE.customProducts && !Array.isArray(STATE.customProducts)){
    var flatCustom = [];
    ['am','pm','hair'].forEach(function(sec){
      (STATE.customProducts[sec]||[]).forEach(function(p){
        flatCustom.push(p);
        if(STATE.productOrder[sec].indexOf(p.id)<0) STATE.productOrder[sec].push(p.id);
      });
    });
    STATE.customProducts = flatCustom;
  }
  if(!Array.isArray(STATE.customProducts)) STATE.customProducts = [];
  if('vitaminCUnlocked' in STATE){
    if(STATE.vitaminCUnlocked && STATE.productOrder.am.indexOf('am-vitaminc')<0){
      var cIdx = STATE.productOrder.am.indexOf('am-cleanser');
      STATE.productOrder.am.splice(cIdx+1, 0, 'am-vitaminc');
    }
    delete STATE.vitaminCUnlocked;
  }

  LOGS = await safeGet('logs', {});
  PHOTO_INDEX = await safeGet('photo-index', []);
  PHOTO_INDEX.forEach(function(p){ if(!p.id) p.id = p.date+':'+p.angle; });
  HAIR_PHOTO_INDEX = await safeGet('hair-photo-index', []);
  HAIR_PHOTO_INDEX.forEach(function(p){ if(!p.id) p.id = p.date+':'+p.angle; });

}

   PRODUCTS (editable, reorderable registry — fixed + custom, one unified lookup)
   ========================================================= */
function isDueOn(freq, iso){
  if(!freq || freq.type!=='weekly') return true; // no frequency set = daily
  if(!iso) return true; // defensive: unknown date context, never hide a step by accident
  var dow = fromISO(iso).getDay();
  return (freq.days||[]).indexOf(dow) >= 0;
}
function freqLabel(freq){
  if(!freq || freq.type!=='weekly') return 'Every day';
  var names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var days=(freq.days||[]).slice().sort(function(a,b){return a-b;});
  if(days.length===0) return 'Not scheduled';
  if(days.length===7) return 'Every day';
  return days.map(function(d){return names[d];}).join(', ');
}
function findCustomProduct(id){
  return (STATE.customProducts||[]).filter(function(p){ return p.id===id; })[0] || null;
}
function getProductInfo(id){
  var base = DEFAULT_PRODUCTS[id];
  var over = STATE.productOverrides[id];
  if(base){
    return {
      id: id,
      name: (over && over.name) ? over.name : base.name,
      role: (over && over.role!==undefined) ? over.role : (base.role||''),
      wait: (over && over.wait!==undefined) ? over.wait : (base.wait||''),
      frequency: (over && over.frequency) ? over.frequency : (base.frequency || {type:'daily'}),
      critical: !!base.critical,
      isCustom: false
    };
  }
  var custom = findCustomProduct(id);
  if(custom){
    return {
      id: id,
      name: (over && over.name) ? over.name : custom.name,
      role: (over && over.role!==undefined) ? over.role : (custom.role||'Custom addition'),
      wait: (over && over.wait!==undefined) ? over.wait : (custom.wait||''),
      frequency: (over && over.frequency) ? over.frequency : (custom.frequency||{type:'daily'}),
      critical: false,
      isCustom: true
    };
  }
  // Orphaned id (e.g. data corruption) — degrade gracefully rather than throw.
  return {id:id, name:id, role:'', wait:'', frequency:{type:'daily'}, critical:false, isCustom:true};
}

/* =========================================================
   ROUTINE
   ========================================================= */
function isNightA(iso){
  var diff = diffDays(STATE.epoch, iso);
  return (((diff % 2) + 2) % 2) === 0;
}
function getAMSteps(iso){
  return STATE.productOrder.am.map(getProductInfo)
    .filter(function(s){ return isDueOn(s.frequency, iso); });
}
function getPMSteps(iso){
  // The two alternating actives both live in productOrder at whatever position the
  // user placed them; only the one active for tonight is kept, the other filtered out.
  var inactiveId = isNightA(iso) ? 'pm-azelaic' : 'pm-salicylic';
  return STATE.productOrder.pm
    .filter(function(id){ return id !== inactiveId; })
    .map(getProductInfo)
    .filter(function(s){ return isDueOn(s.frequency, iso); });
}
function getHairSteps(iso){
  return STATE.productOrder.hair.map(getProductInfo)
    .filter(function(s){ return isDueOn(s.frequency, iso); });
}
function isScheduled(stepId, iso){
  if(getAMSteps(iso).some(function(s){return s.id===stepId;})) return true;
  if(getPMSteps(iso).some(function(s){return s.id===stepId;})) return true;
  return getHairSteps(iso).some(function(s){return s.id===stepId;});
}
function getRoutineSteps(section, iso){
  if(section==='am') return getAMSteps(iso);
  if(section==='pm') return getPMSteps(iso);
  return getHairSteps(iso);
}
function computeRoutineStreak(section, uptoISO){
  var streak=0, d=uptoISO, guard=0;
  while(guard<3650){
    guard++;
    var steps = getRoutineSteps(section, d);
    if(steps.length===0){ d=addDays(d,-1); continue; } // nothing due that day — skip, don't break or count
    var day = LOGS[d] || {};
    var allDone = steps.every(function(s){ return day[s.id]==='done'; });
    if(allDone){ streak++; d=addDays(d,-1); continue; }
    break; // any missing or skipped step ends the streak here
  }
  return streak;
}
function completionFraction(iso){
  var all = getAMSteps(iso).concat(getPMSteps(iso));
  var day = LOGS[iso] || {};
  var done = all.filter(function(s){return day[s.id]==='done';}).length;
  return {done:done, total:all.length};
}

/* =========================================================
   WATER
   ========================================================= */
function getWaterInfo(){
  var iso = todayISO();
  var day = LOGS[iso] || {};
  var consumed = day._water || 0;
  var target = STATE.waterTargetMl || 2500;
  var remaining = Math.max(0, target - consumed);
  var pct = target>0 ? Math.min(1, consumed/target) : 0;
  var overdue = false;
  if(consumed === 0){ overdue = new Date().getHours() >= 10; }
  else if(day._waterLastTs){ overdue = (Date.now() - day._waterLastTs) >= 2*3600*1000; }
  return {consumed:consumed, target:target, remaining:remaining, pct:pct, overdue:overdue};
}
function addWater(ml){
  var day = ensureDay(todayISO());
  day._water = (day._water||0) + ml;
  day._waterLastTs = Date.now();
  day._waterLastAdd = ml; // enables a one-step undo of exactly this tap
  saveLogs();
}
function undoLastWater(){
  var day = LOGS[todayISO()];
  if(!day || !day._waterLastAdd){ toast('Nothing to undo'); return; }
  day._water = Math.max(0, (day._water||0) - day._waterLastAdd);
  delete day._waterLastAdd;
  saveLogs();
  renderActiveView();
  if(currentModalRefresh) currentModalRefresh();
  toast('Undone');
}

/* =========================================================
   NOTE INSIGHTS (AI + local fallback)
   ========================================================= */
function collectRecentNotes(days){
  var iso = todayISO(), cutoff = addDays(iso,-days), notes=[];
  for(var d in LOGS){
    if(d>=cutoff && d<=iso && LOGS[d] && LOGS[d]._note && LOGS[d]._note.trim()){
      notes.push({date:d, note:LOGS[d]._note.trim()});
    }
  }
  notes.sort(function(a,b){return a.date.localeCompare(b.date);});
  return notes;
}
function localFallbackInsight(notes){
  var text = notes.map(function(n){return n.note.toLowerCase();}).join(' ');
  var pos = (text.match(/\b(better|clear|calm|improv|good|glow|smooth|great)\b/g)||[]).length;
  var neg = (text.match(/\b(dry|oily|breakout|irritat|red|itch|bad|worse|sensitive|flare|burn|sting)\b/g)||[]).length;
  if(pos>neg && pos>0) return 'Your recent notes lean positive — skin seems to be trending calmer lately.';
  if(neg>pos && neg>0) return 'A few notes mention irritation, dryness, or breakouts more than once — worth raising at your next derm visit.';
  return 'No strong pattern yet in your notes — keep logging and it will get clearer over time.';
}
async function generateSkinInsight(){
  var notes = collectRecentNotes(14);
  if(notes.length < 2) return {ok:false};
  var notesText = notes.map(function(n){return fmtShortNoYear(n.date)+': '+n.note;}).join('\n');
  var prompt = 'Here are dated skincare journal notes from the last two weeks:\n' + notesText +
    '\n\nBased only on these notes, write ONE short warm conversational sentence (max 25 words) reflecting a pattern in how the skin has been feeling. Start with something like "Over the last few days" or "Lately". Do not give medical advice or diagnose anything. If there is no clear pattern, make a gentle general observation. Respond with only that sentence, no quotation marks.';
  try{
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers: aiHeaders(),
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user', content:prompt}]})
    });
    var data = await res.json();
    if(data.error) throw new Error('api');
    var block = (data.content||[]).find(function(b){return b.type==='text';});
    if(!block || !block.text || !block.text.trim()) throw new Error('empty');
    return {ok:true, text:block.text.trim(), source:'ai', noteCount:notes.length};
  }catch(e){
    return {ok:true, text:localFallbackInsight(notes), source:'local', noteCount:notes.length};
  }
}

/* =========================================================
   PROGRESS INSIGHT (deterministic, from logged data)
   ========================================================= */
function computeProgressInsight(range){
  var iso = todayISO();
  var amDone=0, amTotal=0, pmDone=0, pmTotal=0, fullDays=0, anyDays=0;
  var dowDone=[0,0,0,0,0,0,0], dowCount=[0,0,0,0,0,0,0];
  for(var i=range-1;i>=0;i--){
    var d = addDays(iso,-i);
    var am = getAMSteps(d), pm = getPMSteps(d), log = LOGS[d] || {};
    var a = am.filter(function(s){return log[s.id]==='done';}).length;
    var p = pm.filter(function(s){return log[s.id]==='done';}).length;
    amDone+=a; amTotal+=am.length; pmDone+=p; pmTotal+=pm.length;
    if(am.length+pm.length>0 && a+p >= am.length+pm.length) fullDays++;
    if(a+p>0) anyDays++;
    var dow = fromISO(d).getDay();
    dowDone[dow]+=(a+p); dowCount[dow]+=(am.length+pm.length);
  }
  if(anyDays===0) return {empty:true};

  var amPct = amTotal ? amDone/amTotal : 0;
  var pmPct = pmTotal ? pmDone/pmTotal : 0;
  var worstDow=-1, worstRate=2;
  for(var j=0;j<7;j++){
    if(dowCount[j]>0){
      var rate = dowDone[j]/dowCount[j];
      if(rate<worstRate){ worstRate=rate; worstDow=j; }
    }
  }
  var dowNames=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
  var lines=[];
  if(Math.abs(amPct-pmPct) >= 0.15){
    var strong = amPct>pmPct ? 'mornings' : 'evenings';
    var weak   = amPct>pmPct ? 'evenings' : 'mornings';
    lines.push('Your '+strong+' are noticeably more consistent than your '+weak+' ('+Math.round(Math.max(amPct,pmPct)*100)+'% vs '+Math.round(Math.min(amPct,pmPct)*100)+'%).');
  } else {
    lines.push('Mornings and evenings are running about even ('+Math.round(amPct*100)+'% and '+Math.round(pmPct*100)+'%).');
  }
  if(worstDow>=0 && worstRate<0.6 && range>=7){
    lines.push(dowNames[worstDow]+' are where steps slip most often.');
  }
  lines.push(fullDays+' of the last '+range+' days were fully complete.');
  return {empty:false, text:lines.join(' ')};
}

// Threshold is deliberately conservative: these scores swing with lighting and
// camera, so a small drift is noise, not a trend. Requires 4+ photos and a
// difference of 0.75+ between the earlier and later half before claiming direction.
var TREND_MIN_PHOTOS = 4;
var TREND_MIN_DELTA = 0.75;
function computePatternText(list, metrics){
  if(list.length < 2) return null;
  var span = diffDays(list[0].date, list[list.length-1].date);
  if(list.length < TREND_MIN_PHOTOS){
    return list.length+' photos analysed so far — a couple more and I can tell you which way things are heading.';
  }
  var half = Math.floor(list.length/2);
  var early = list.slice(0, half), late = list.slice(half);
  var avg = function(arr,k){
    return arr.reduce(function(s,p){return s+p.scores[k];},0)/arr.length;
  };
  var parts=[];
  metrics.forEach(function(m){
    var delta = avg(late,m.key) - avg(early,m.key);
    if(delta >= TREND_MIN_DELTA) parts.push(m.label.toLowerCase()+' has been trending up');
    else if(delta <= -TREND_MIN_DELTA) parts.push(m.label.toLowerCase()+' has dipped slightly');
  });
  if(!parts.length) return 'Across '+list.length+' analysed photos over '+span+' days, your scores have held fairly steady.';
  return 'Across '+list.length+' analysed photos over '+span+' days, '+parts.join(', and ')+'.';
}
function computeTexturePattern(){ return computePatternText(analyzedSkinPhotos(), TEXTURE_METRICS); }
function analyzedHairPhotos(){
  return HAIR_PHOTO_INDEX.filter(function(p){ return p.scores && (p.scores.fullness || p.scores.coverage || p.scores.shine); })
    .sort(function(a,b){ return a.date.localeCompare(b.date); });
}
function computeHairPattern(){ return computePatternText(analyzedHairPhotos(), HAIR_METRICS); }

function toast(msg, actionLabel, actionFn){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  if(actionLabel && actionFn){
    var btn = document.createElement('button');
    btn.className='toast-action';
    btn.textContent=actionLabel;
    btn.addEventListener('click', function(){
      actionFn();
      el.classList.remove('show');
      setTimeout(function(){ el.remove(); }, 300);
    });
    el.appendChild(btn);
  }
  root.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  var duration = actionLabel ? 4200 : 2600;
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){el.remove();},300); }, duration);
}

function circleStateFor(done,total){
  if(total===0 || done<=0) return 'none';
  if(done>=total) return 'full';
  return 'half';
}
function stateCircleSVG(state, color, size){
  size = size || 18;
  var inset = Math.max(2, size*0.07);
  var c = size/2, r = size/2 - inset;
  var sw = Math.max(1.3, size*0.035);
  if(state==='full'){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="'+color+'"/></svg>';
  }
  if(state==='half'){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
      + '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" opacity="0.35"/>'
      + '<path d="M'+c+','+(c-r)+' A'+r+','+r+' 0 0 1 '+c+','+(c+r)+' Z" fill="'+color+'"/></svg>';
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" opacity="0.35"/></svg>';
}
function renderPatternTracks(range){
  var iso = todayISO();
  var labelInterval = range<=7 ? 1 : (range<=15 ? 3 : 5);
  var dayCells='', nightCells='', labelCells='';
  for(var i=range-1;i>=0;i--){
    var d = addDays(iso,-i);
    var idx = range-1-i;
    var am = getAMSteps(d), pm = getPMSteps(d), log = LOGS[d] || {};
    var a = am.filter(function(s){return log[s.id]==='done';}).length;
    var p = pm.filter(function(s){return log[s.id]==='done';}).length;
    dayCells   += '<div class="dn-cell">'+stateCircleSVG(circleStateFor(a,am.length),'var(--dawn)',18)+'</div>';
    nightCells += '<div class="dn-cell">'+stateCircleSVG(circleStateFor(p,pm.length),'var(--dusk)',18)+'</div>';
    labelCells += '<div class="dn-cell dn-label">'+((idx%labelInterval===0)? fromISO(d).getDate() : '')+'</div>';
  }
  return {dayCells:dayCells, nightCells:nightCells, labelCells:labelCells};
}
function renderProgress(){
  var iso = todayISO();
  var tracks = renderPatternTracks(progressRange);
  var insight = computeProgressInsight(progressRange);

  var insightHTML = insight.empty
    ? '<div class="insight-card empty"><div class="ic-title">What the data shows</div><div class="ic-body">Start checking off steps and patterns will show up here.</div></div>'

      + '<div class="ic-foot">From your last '+progressRange+' days of logs</div></div>';

function hydrateLazyPhotos(){

function renderTextureTrend(){
  var list = analyzedSkinPhotos();
  if(list.length === 0) return '';
  var pattern = computeTexturePattern();
  var rows = '';
  TEXTURE_METRICS.forEach(function(m){
    var latest = list[list.length-1].scores[m.key];
    var bars = '';
    list.slice(-12).forEach(function(p){
      var v = p.scores[m.key];
      bars += '<div class="trend-bar" style="height:'+(v/5*34)+'px; background:'+m.color+'; opacity:'+(0.35+v/5*0.65)+'"></div>';
    });
    rows += '<div class="trend-row"><div class="tr-head"><span class="tr-name">'+m.label+'</span>'
      + '<span class="tr-val">latest '+latest+'/5</span></div>'

  });
  return '<div class="trend-card"><h3>Texture over time</h3>'
    + '<div class="sec-sub" style="margin-top:6px;">'

    + rows

  var sorted = photoIndex.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });

    if(!byDate[p.date]){ byDate[p.date] = {date:p.date, items:[]}; groups.push(byDate[p.date]); }
    byDate[p.date].items.push(p);
  });
  return groups;

function compressImage(file, maxDim, quality){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        var canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleFileChosen(e){
  var file = e.target.files[0];
  if(!file) return;
  try{
    var dataUrl = await compressImage(file, 900, 0.72);
    pendingPhotoDataUrl = dataUrl;
    document.getElementById('ap-preview-wrap').innerHTML = '<img src="'+dataUrl+'">';
    document.getElementById('ap-save').disabled = false;
  }catch(err){ toast('Could not read that image'); }
}

  var btn = document.getElementById('ap-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  // Own id per upload (not keyed by date+angle) so multiple photos a day never overwrite each other.
  var id = newPhotoId(date, angle);
  var ok = await safeSet('photo:'+id, {image:pendingPhotoDataUrl, note:note});

    PHOTO_INDEX.push({id:id, date:date, angle:angle, note:note});

/* ---------- drag-to-reorder (pointer events, works on touch and mouse) ---------- */
function computeDropIndex(otherMids, draggedMidY){
  var dropIndex = 0;
  for(var j=0;j<otherMids.length;j++){
    if(draggedMidY > otherMids[j]) dropIndex = j+1;
  }
  return dropIndex;
}
var productDragState = null;
var productDragListenersAttached = false;
function initProductDrag(){
  if(!productDragListenersAttached){
    productDragListenersAttached = true;
    document.addEventListener('pointermove', function(e){
      if(!productDragState) return;
      var dy = e.clientY - productDragState.startY;
      productDragState.row.style.transform = 'translateY('+dy+'px)';
    });
    document.addEventListener('pointerup', finishProductDrag);
    document.addEventListener('pointercancel', finishProductDrag);
  }
  var handles = document.querySelectorAll('.mp-drag');
  Array.prototype.forEach.call(handles, function(handle){
    handle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var row = handle.closest('.mp-row');
      var list = row.parentElement;
      var rows = Array.prototype.slice.call(list.querySelectorAll('.mp-row'));
      productDragState = {
        row: row,
        section: row.dataset.section,
        id: row.dataset.id,
        startY: e.clientY,
        fromIndex: rows.indexOf(row),
        rowRects: rows.map(function(r){ return r.getBoundingClientRect(); })
      };
      row.classList.add('dragging');
    });
  });
}
function finishProductDrag(e){
  if(!productDragState) return;
  var st = productDragState;
  st.row.style.transform = '';
  st.row.classList.remove('dragging');

  var dy = e.clientY - st.startY;
  var draggedRect = st.rowRects[st.fromIndex];
  var draggedMidY = draggedRect.top + draggedRect.height/2 + dy;
  var otherMids = [];
  for(var i=0;i<st.rowRects.length;i++){
    if(i===st.fromIndex) continue;
    otherMids.push(st.rowRects[i].top + st.rowRects[i].height/2);
  }
  var dropIndex = computeDropIndex(otherMids, draggedMidY);

  if(dropIndex !== st.fromIndex){
    var order = STATE.productOrder[st.section];
    var idx = order.indexOf(st.id);
    order.splice(idx, 1);
    order.splice(dropIndex, 0, st.id);
    saveState(); renderActiveView();
  }
  openManageProductsModal();
  productDragState = null;
}

  setTimeout(function(){ var t=document.getElementById('np-name'); if(t) t.focus(); }, 50);
}

async function exportAllData(){
  var bundle = {version:1, exportedAt:new Date().toISOString(), state:STATE, logs:LOGS,
                photoIndex:PHOTO_INDEX, hairPhotoIndex:HAIR_PHOTO_INDEX, insight:INSIGHT_CACHE, photos:{}};
  for(var i=0;i<PHOTO_INDEX.length;i++){
    var k='photo:'+PHOTO_INDEX[i].date+':'+PHOTO_INDEX[i].angle;
    bundle.photos[k] = await safeGet(k, null);
  }
  for(var j=0;j<HAIR_PHOTO_INDEX.length;j++){
    var hk='hairphoto:'+HAIR_PHOTO_INDEX[j].date+':'+HAIR_PHOTO_INDEX[j].angle;
    bundle.photos[hk] = await safeGet(hk, null);
  }
  var blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'dawn-to-dusk-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  toast('Backup downloaded');
}
async function handleImportFile(e){
  var file = e.target.files[0];
  if(!file) return;
  try{
    var text = await file.text();
    var b = JSON.parse(text);
    if(!b || !b.state || !b.logs) throw new Error('shape');
    STATE = b.state; LOGS = b.logs;
    PHOTO_INDEX = b.photoIndex || []; HAIR_PHOTO_INDEX = b.hairPhotoIndex || [];
    INSIGHT_CACHE = b.insight || null;
    var d = defaultState();
    for(var k in d){ if(!(k in STATE)) STATE[k]=d[k]; }
    await safeSet('app-state', STATE); await safeSet('logs', LOGS);
    await safeSet('photo-index', PHOTO_INDEX); await safeSet('hair-photo-index', HAIR_PHOTO_INDEX);
    await safeSet('insight-cache', INSIGHT_CACHE);
    if(b.photos){ for(var pk in b.photos){ if(b.photos[pk]) await safeSet(pk, b.photos[pk]); } }
    Object.keys(photoCache).forEach(function(x){ delete photoCache[x]; });
    Object.keys(hairPhotoCache).forEach(function(x){ delete hairPhotoCache[x]; });
    closeModal(); renderActiveView(); toast('Backup restored');
  }catch(err){ toast('That file could not be read as a backup'); }
}
function openApiKeyModal(){
  openModal(
    '<div class="modal-head"><h3>AI features</h3><button class="modal-close" data-action="close-modal">×</button></div>'
    + '<div class="sec-sub" style="margin-bottom:10px;">Photo analysis and note insights call the Anthropic API. Outside the Claude app you need your own key from console.anthropic.com. It is stored only on this device and sent only to Anthropic. Anyone with access to this device could read it, so use a key you can revoke.</div>'
    + '<div class="field"><label>API key</label><input type="password" id="ak-key" value="'+escapeHtml(STATE.apiKey||'')+'" placeholder="sk-ant-..." autocomplete="off"></div>'
    + '<button class="modal-save" data-action="save-api-key">Save key</button>'
    + (STATE.apiKey ? '<button class="modal-del" data-action="clear-api-key">Remove key from this device</button>' : '')
  );
}

/* =========================================================
   VIEW SWITCHING
   ========================================================= */
function resolveTheme(){
  if(STATE.theme === 'dynamic'){
    var hour = new Date().getHours();
    var isDay = hour>=7 && hour<19;
    return isDay ? (STATE.dynamicLightTheme || 'classic') : (STATE.dynamicDarkTheme || 'neon');
  }
  return STATE.theme || 'classic';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolveTheme());
}
function applyTodayBackground(){
  var hour = new Date().getHours() + new Date().getMinutes()/60;
  var tint = PHASE_STYLES[getPhase(hour)].tint;
  document.getElementById('view-today').style.background =
    'linear-gradient(180deg, '+tint+' 0px, var(--paper) 150px)';
}
function updateTopbarStyle(){
  var topbarEl = document.querySelector('.topbar');
  var wordmarkB = document.querySelector('.topbar .wordmark b');
  var gearBtn = document.querySelector('.gear-btn');
  var isToday = currentView==='today';
  topbarEl.classList.toggle('overlay', isToday);
  if(isToday){
    var hour = new Date().getHours() + new Date().getMinutes()/60;
    var st = PHASE_STYLES[getPhase(hour)];
    topbarEl.style.color = st.ink;
    topbarEl.style.textShadow = st.shadow;
    if(wordmarkB) wordmarkB.style.color = st.ink;
    gearBtn.style.color = st.ink;
    gearBtn.style.background = st.chip;
    gearBtn.style.borderColor = 'rgba(255,255,255,0.45)';
  } else {
    topbarEl.style.color = '';
    topbarEl.style.textShadow = '';
    if(wordmarkB) wordmarkB.style.color = '';
    gearBtn.style.color = '';
    gearBtn.style.background = '';
    gearBtn.style.borderColor = '';
  }
}
function renderActiveView(){
  applyTheme();
  var map = {today:renderToday, calendar:renderCalendar, progress:renderProgress, photos:renderPhotos, hair:renderHair};
  var views = document.querySelectorAll('.view');
  Array.prototype.forEach.call(views, function(v){ v.classList.remove('active'); });
  var el = document.getElementById('view-'+currentView);
  el.innerHTML = map[currentView]();
  el.classList.add('active');
  var navs = document.querySelectorAll('.nav-btn');
  Array.prototype.forEach.call(navs, function(b){ b.classList.toggle('active', b.dataset.view===currentView); });
  updateTopbarStyle();
  if(!storageHealthy){
    var warn = document.createElement('div');
    warn.className = 'storage-warn';
    warn.innerHTML = '<strong>Nothing is being saved.</strong> This browser is blocking storage for local files, '
      + 'so anything you log will disappear when you close the app. Open it from a web address instead, '
      + 'or use it inside the Claude app.';
    el.insertBefore(warn, el.firstChild);
  }
  if(currentView==='today') applyTodayBackground();
  if(currentView==='photos') hydrateLazyPhotos();
  if(currentView==='hair') hydrateLazyHairPhotos();
}

/* =========================================================
   EVENT HANDLERS
   ========================================================= */
document.addEventListener('click', async function(e){
  var nav = e.target.closest('.nav-btn');
  if(nav){ currentView = nav.dataset.view; renderActiveView(); return; }
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;

  if(action==='toggle-step'){
    var day = ensureDay(el.dataset.date);
    var s = el.dataset.step, cur = day[s];
    if(cur==='done') day[s]='skipped';
    else if(cur==='skipped') delete day[s];
    else day[s]='done';
    saveLogs(); renderActiveView();
    if(currentModalRefresh) currentModalRefresh();
  }
  else if(action==='toggle-period'){
    var dp = el.dataset.date, ip = STATE.periodDays.indexOf(dp);
    if(ip>=0) STATE.periodDays.splice(ip,1); else STATE.periodDays.push(dp);
    saveState(); renderActiveView();
    if(currentModalRefresh) currentModalRefresh();
  }
  else if(action==='toggle-shampoo'){
    if(!STATE.shampooDays) STATE.shampooDays = [];
    var ds = el.dataset.date, is_ = STATE.shampooDays.indexOf(ds);
    if(is_>=0) STATE.shampooDays.splice(is_,1); else STATE.shampooDays.push(ds);
    saveState(); renderActiveView();
    if(currentModalRefresh) currentModalRefresh();
  }
  else if(action==='toggle-workout'){
    var dw = el.dataset.date, iw = STATE.workoutDays.indexOf(dw);
    if(iw>=0) STATE.workoutDays.splice(iw,1); else STATE.workoutDays.push(dw);
    saveState(); renderActiveView();
    if(currentModalRefresh) currentModalRefresh();
  }
  else if(action==='open-add-event'){ openAddEventModal(el.dataset.date || null); }
  else if(action==='save-event'){
    var evDate = document.getElementById('ev-date').value;
    var evTitle = document.getElementById('ev-title').value.trim();
    if(!evDate || !evTitle){ toast('Add a date and a title'); return; }
    STATE.events.push({date:evDate, title:evTitle});
    saveState(); closeModal(); renderActiveView(); toast('Event added');
  }
  else if(action==='delete-event'){
    var de = el.dataset.date, te = el.dataset.title;
    STATE.events = STATE.events.filter(function(ev){ return !(ev.date===de && ev.title===te); });
    saveState(); renderActiveView();
    if(currentModalRefresh) currentModalRefresh(); else closeModal();
  }
  else if(action==='water-add'){
    var ml = parseInt(el.dataset.ml,10) || 0;
    addWater(ml); renderActiveView();
    toast('+'+ml+' ml logged', 'Undo', undoLastWater);
    if(currentModalRefresh) currentModalRefresh();
  }
  else if(action==='open-water-quick'){ openWaterQuickModal(); }
  else if(action==='open-water-target'){ openWaterTargetModal(); }
  else if(action==='save-water-target'){
    var wv = parseInt(document.getElementById('wt-target').value,10);
    if(wv>0){ STATE.waterTargetMl=wv; saveState(); closeModal(); renderActiveView(); toast('Target updated'); }
    else toast('Enter a valid amount');
  }
  else if(action==='open-settings'){ openSettingsModal(); }
  else if(action==='set-theme'){
    STATE.theme = el.dataset.theme;
    saveState();
    applyTheme();
    openSettingsModal();
    toast('Theme updated');
  }
  else if(action==='set-dynamic-sub'){
    if(el.dataset.kind==='light') STATE.dynamicLightTheme = el.dataset.theme;
    else STATE.dynamicDarkTheme = el.dataset.theme;
    saveState();
    applyTheme();
    openSettingsModal();
    toast('Updated');
  }
  else if(action==='open-manage-products'){ openManageProductsModal(); }
  else if(action==='export-data'){ await exportAllData(); }
  else if(action==='import-data'){ document.getElementById('import-file').click(); }
  else if(action==='open-api-key'){ openApiKeyModal(); }
  else if(action==='save-api-key'){
    STATE.apiKey = document.getElementById('ak-key').value.trim();
    saveState(); closeModal(); openSettingsModal();
    toast(STATE.apiKey ? 'Key saved on this device' : 'Key cleared');
  }
  else if(action==='clear-api-key'){
    STATE.apiKey = ''; saveState(); closeModal(); openSettingsModal(); toast('Key removed');
  }
  else if(action==='open-edit-product'){
    openEditProductModal(el.dataset.id, el.dataset.section);
  }
  else if(action==='save-edit-product'){
    var epName = document.getElementById('ep-name').value.trim();
    var epRole = document.getElementById('ep-role').value.trim();
    var epWait = document.getElementById('ep-wait').value.trim();
    if(!epName){ toast('Give it a name'); return; }
    var epFreq = editingFrequency || {type:'daily'};
    var epId = el.dataset.id;
    var epInfo = getProductInfo(epId);
    if(epInfo.isCustom){
      var custom = findCustomProduct(epId);
      if(custom){ custom.name=epName; custom.role=epRole; custom.wait=epWait; custom.frequency=epFreq; }
    } else {
      STATE.productOverrides[epId] = {name:epName, role:epRole, wait:epWait, frequency:epFreq};
    }
    saveState(); renderActiveView(); openManageProductsModal(); toast('Saved');
  }
  else if(action==='open-add-product'){ openAddProductModal(el.dataset.section); }
  else if(action==='save-add-product'){
    var npName = document.getElementById('np-name').value.trim();
    var npRole = document.getElementById('np-role').value.trim();
    var npWait = document.getElementById('np-wait').value.trim();
    if(!npName){ toast('Give it a name'); return; }
    var npSection = el.dataset.section;
    var npAfter = document.getElementById('np-after').value;
    // Unique, stable id so historical log entries never collide or get reassigned.
    var newId = 'custom-'+npSection+'-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*100000).toString(36);
    STATE.customProducts.push({id:newId, name:npName, role:npRole, wait:npWait, frequency:editingFrequency||{type:'daily'}});
    var order = STATE.productOrder[npSection];
    var insertAt = npAfter ? order.indexOf(npAfter)+1 : order.length;
    order.splice(insertAt, 0, newId);
    saveState(); renderActiveView(); openManageProductsModal(); toast('Product added');
  }
  else if(action==='set-freq-daily'){
    editingFrequency = {type:'daily'};
    var fr1 = document.getElementById('freq-picker-root'); if(fr1) fr1.innerHTML = renderFreqPicker();
  }
  else if(action==='set-freq-weekly'){
    editingFrequency = {type:'weekly', days:(editingFrequency && editingFrequency.days) || []};
    var fr2 = document.getElementById('freq-picker-root'); if(fr2) fr2.innerHTML = renderFreqPicker();
  }
  else if(action==='toggle-freq-day'){
    var dayNum = parseInt(el.dataset.day, 10);
    if(!editingFrequency || editingFrequency.type!=='weekly') editingFrequency = {type:'weekly', days:[]};
    var dIdx = editingFrequency.days.indexOf(dayNum);
    if(dIdx>=0) editingFrequency.days.splice(dIdx,1); else editingFrequency.days.push(dayNum);
    var fr3 = document.getElementById('freq-picker-root'); if(fr3) fr3.innerHTML = renderFreqPicker();
  }
  else if(action==='delete-product'){
    var dId = el.dataset.id, dSection = el.dataset.section;
    STATE.productOrder[dSection] = STATE.productOrder[dSection].filter(function(id){ return id !== dId; });
    // Also drop stored custom-product data if this was a custom entry (harmless no-op for fixed ids).
    STATE.customProducts = STATE.customProducts.filter(function(p){ return p.id !== dId; });
    saveState(); renderActiveView(); openManageProductsModal(); toast('Product removed');
  }
  else if(action==='reset-epoch'){
    STATE.epoch = todayISO(); saveState(); renderActiveView();
    if(currentModalRefresh) currentModalRefresh();
    toast('Tonight is now Night A');
  }
  else if(action==='refresh-insight'){
    el.disabled = true; el.textContent = 'Thinking…';
    var r = await generateSkinInsight();
    if(r.ok){
      INSIGHT_CACHE = {text:r.text, generatedAt:todayISO(), noteCount:r.noteCount, source:r.source};
      saveInsightCache();
    } else toast('Add a couple more day notes first');
    renderActiveView();
  }
  else if(action==='analyze-photo'){
    el.disabled = true; el.textContent = 'Analysing…';
    var ar = await analyzePhoto(el.dataset.id);
    if(ar.ok) toast('Analysis saved');
    else if(ar.reason==='unclear') toast(ar.note || 'Photo too unclear to read reliably');
    else toast('Could not analyse that photo — try again');
    if(currentModalRefresh) currentModalRefresh();
    renderActiveView();
  }
  else if(action==='dismiss-tip'){ STATE.tipDismissed=true; saveState(); renderActiveView(); }
  else if(action==='cal-prev'){ calMonthCursor = new Date(calMonthCursor.getFullYear(), calMonthCursor.getMonth()-1, 1); renderActiveView(); }
  else if(action==='cal-next'){ calMonthCursor = new Date(calMonthCursor.getFullYear(), calMonthCursor.getMonth()+1, 1); renderActiveView(); }
  else if(action==='set-range'){ progressRange = parseInt(el.dataset.range,10) || 7; renderActiveView(); }
  else if(action==='open-day'){ openDayModal(el.dataset.date); }
  else if(action==='close-modal'){ closeModal(); }
  else if(action==='open-add-photo'){ openAddPhotoModal(); }
  else if(action==='trigger-file'){ document.getElementById('ap-file').click(); }
  else if(action==='save-photo'){ savePendingPhoto(); }
  else if(action==='view-photo'){ openPhotoViewer(el.dataset.id); }
  else if(action==='toggle-photo-visibility'){
    var kind = el.dataset.kind;
    if(kind==='hair') STATE.photosHiddenHair = !STATE.photosHiddenHair;
    else STATE.photosHiddenSkin = !STATE.photosHiddenSkin;
    saveState(); renderActiveView();
  }
  else if(action==='toggle-day-group'){
    var key = el.dataset.key;
    if(collapsedDayGroups[key]) delete collapsedDayGroups[key];
    else collapsedDayGroups[key] = true;
    renderActiveView();
  }
  else if(action==='set-compare-angle'){
    if(el.dataset.kind==='hair') compareAngleHair = el.dataset.angle;
    else compareAngleSkin = el.dataset.angle;
    renderActiveView();
  }
  else if(action==='delete-photo'){ deletePhotoEntry(el.dataset.id); }
  else if(action==='open-add-hairphoto'){ openAddHairPhotoModal(); }
  else if(action==='trigger-hairfile'){ document.getElementById('ahp-file').click(); }
  else if(action==='save-hairphoto'){ savePendingHairPhoto(); }
  else if(action==='view-hairphoto'){ openHairPhotoViewer(el.dataset.id); }
  else if(action==='delete-hairphoto'){ deleteHairPhotoEntry(el.dataset.id); }
  else if(action==='analyze-hairphoto'){
    el.disabled = true; el.textContent = 'Analysing…';
    var hr = await analyzeHairPhoto(el.dataset.id);
    if(hr.ok) toast('Analysis saved');
    else if(hr.reason==='unclear') toast(hr.note || 'Photo too unclear to read reliably');
    else toast('Could not analyse that photo — try again');
    if(currentModalRefresh) currentModalRefresh();
    renderActiveView();
  }
  else if(action==='confirm-reset'){
    openModal('<div class="modal-head"><h3>Reset everything?</h3><button class="modal-close" data-action="close-modal">×</button></div>'
      + '<div class="sec-sub">This clears your routine log, events, and photos. This cannot be undone.</div>'
      + '<button class="modal-del" data-action="do-reset">Yes, reset everything</button>');
  }
  else if(action==='do-reset'){ await doFullReset(); }
});

document.addEventListener('input', function(e){
  if(e.target.dataset.action==='note-input'){
    ensureDay(e.target.dataset.date)._note = e.target.value;
    saveLogs();
  }
  if(e.target.dataset.action==='ba-slide'){
    var img = document.getElementById('ba-after-img');
    if(img) img.style.clipPath = 'inset(0 '+(100-e.target.value)+'% 0 0)';
  }
  if(e.target.dataset.action==='hair-ba-slide'){
    var himg = document.getElementById('hair-ba-after-img');
    if(himg) himg.style.clipPath = 'inset(0 '+(100-e.target.value)+'% 0 0)';
  }
});

async function doFullReset(){
  closeModal();
  for(var i=0;i<PHOTO_INDEX.length;i++){
    await safeDelete('photo:'+PHOTO_INDEX[i].date+':'+PHOTO_INDEX[i].angle);
  }
  for(var j=0;j<HAIR_PHOTO_INDEX.length;j++){
    await safeDelete('hairphoto:'+HAIR_PHOTO_INDEX[j].date+':'+HAIR_PHOTO_INDEX[j].angle);
  }
  await safeDelete('app-state'); await safeDelete('logs');
  await safeDelete('photo-index'); await safeDelete('hair-photo-index'); await safeDelete('insight-cache');
  STATE = defaultState(); LOGS = {}; PHOTO_INDEX = []; HAIR_PHOTO_INDEX = []; INSIGHT_CACHE = null;
  Object.keys(photoCache).forEach(function(k){ delete photoCache[k]; });
  Object.keys(hairPhotoCache).forEach(function(k){ delete hairPhotoCache[k]; });
  currentView='today'; renderActiveView(); toast('All data cleared');
}

/* =========================================================
   INIT
   ========================================================= */
async function checkStorageHealth(){
  // Some environments (notably a file:// page on iOS Safari) expose a storage API
  // that silently fails. Prove a real write-then-read round trip before trusting it.
  try{
    var probe = 'health-'+Date.now();
    var okSet = await safeSet('__probe', probe);
    var back = await safeGet('__probe', null);
    await safeDelete('__probe');
    return !!(okSet && back === probe);
  }catch(e){ return false; }
}
async function init(){
  await loadAll();
  storageHealthy = await checkStorageHealth();
  renderActiveView();
  document.getElementById('loading-screen').style.display='none';
  setInterval(function(){
    if(currentView==='today') renderActiveView();
    else applyTheme(); // keep Dynamic mode's light/dark switch current even off the Today tab
  }, 5*60*1000);
}
init();
